# imagecli.toml — user configuration
# Copy to ~/imagecli.toml (or any parent of your working directory)
# The CLI searches upward from CWD to $HOME for this file.

[defaults]
# Default engine: flux2-klein | flux1-dev | sd35
engine = "flux2-klein"

# Image dimensions (pixels) — must be multiples of 64
width = 1024
height = 1024

# Inference steps
# flux2-klein: 50 recommended  |  flux1-dev: 50  |  sd35: fixed at 20
steps = 50

# Guidance scale (classifier-free guidance strength)
# flux2-klein: 4.0  |  flux1-dev: 3.5  |  sd35: 1.0 (turbo, CFG-free)
guidance = 4.0

# Output directory — `~` expands to $HOME; relative paths resolve against CWD.
# Default lives in ~/.roxabi/ to follow the project-wide data convention
# (Code @ ~/projects/<tool>/, data @ ~/.roxabi/<tool>/) and ride the
# Syncthing replication of ~/.roxabi/ between M₁↔M₂.
output_dir = "~/.roxabi/imagecli/out"

# Output image format: png | jpg | webp
format = "png"

# JPEG/WebP quality (1-100, ignored for PNG)
quality = 95

[paths]
# Root directory for external model weights (PuLID, InsightFace, LoRAs).
# Operator action required: mv ~/ComfyUI/models/pulid ~/.roxabi/imagecli/weights/pulid
#                           mv ~/ComfyUI/models/insightface ~/.roxabi/imagecli/weights/insightface
# Default: ~/.roxabi/imagecli/weights/
weights_dir = "~/.roxabi/imagecli/weights"

[blobstore]
# Cross-host HTTP BlobStore (lyra#1330). The NATS image-worker on M₂ PUTs
# generated bytes to the lyra-blobstore.container on M₁ and emits a BlobRef
# on the wire (replaces the legacy image_b64 / file_path response fields).
#
# In production, prefer the Quadlet secret `imagecli-blobstore-token` over
# inlining the token here — `podman secret create imagecli-blobstore-token`.
# Env-var fallback: IMAGECLI_BLOBSTORE_URL, IMAGECLI_BLOBSTORE_TOKEN.
# endpoint = "http://roxabituwer:8449"   # M₁ lyra-blobstore.container
# token    = ""                          # leave blank if using Quadlet secret / env
